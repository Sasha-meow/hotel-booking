server:
  port: 0

spring:
  application:
    name: booking-service-test
  datasource:
    url: jdbc:h2:mem:test-booking;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

eureka:
  client:
    enabled: false
  instance:
    enabled: false

security:
  jwt:
    secret: testSecretKey123456789012345678901234567890
    expiration: 3600000